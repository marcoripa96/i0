services:
  db:
    image: ${REGISTRY}/${REGISTRY_PATH}/pg18-pg_textsearch:pg-${PG_VERSION:-latest}
    restart: unless-stopped
    shm_size: 256mb
    # See docker-compose.yml: without the preload every query against `icons`
    # fails, not just search.
    command: postgres -c shared_preload_libraries=pg_textsearch
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${EXT_DB_PORT:-5432}:5432"
    volumes:
      - i0-pgdata:/var/lib/postgresql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - i0_network

  # Deploying is one command — the database comes up, migrations apply, and an
  # empty database is seeded, in that order:
  #
  #   docker compose -f docker-compose.prod.yml up -d
  #
  # `migrate` and `seed` are one-shot: they run to completion and exit, and
  # compose orders them with service_completed_successfully, so a failed
  # migration stops the seed rather than pointing it at a half-built schema.
  # Both are safe to re-run — see the note on `seed` for what protects the data.
  migrate:
    image: ${REGISTRY}/${REGISTRY_PATH}/i0-migrate:i0-${I0_VERSION:-latest}
    # Waits for the healthcheck, which is also what guarantees docker/init.sql
    # has finished creating the vector and pg_textsearch extensions — the
    # migration's HNSW and BM25 indexes need them to already exist.
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Built from the same POSTGRES_* the database uses, deliberately not
      # reusing the app's DATABASE_URL: that one points at localhost, which
      # inside this container is the container itself. The host here is the
      # compose service name.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    restart: "no"
    networks:
      - i0_network

  # Populates an empty database, then exits.
  #
  # Safe on every deploy because seed.ts counts the icons table first and does
  # nothing when it is already populated. That guard matters: the script begins
  # by deleting every row, so without it a routine `up` would rebuild 303k rows
  # and blank the site while it ran. Re-seed deliberately with:
  #
  #   docker compose -f docker-compose.prod.yml run --rm -e SEED_FORCE=1 seed
  seed:
    image: ${REGISTRY}/${REGISTRY_PATH}/i0-seed:i0-${I0_VERSION:-latest}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    restart: "no"
    networks:
      - i0_network

volumes:
  i0-pgdata:
    name: ${I0_DB_VOLUME:-i0-pgdata}

networks:
  i0_network:
    name: i0_network
    driver: bridge
