services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.pg
    shm_size: 256mb
    # pg_textsearch refuses to serve any scan of a table carrying a BM25 index
    # unless it is preloaded, so without this every query against `icons` fails,
    # not just search. Passed on the command line rather than baked into the
    # image so it also applies to clusters that already exist.
    command: postgres -c shared_preload_libraries=pg_textsearch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
volumes:
  pgdata:
